# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on:
  release:
    types: [published]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: ^22
          registry-url: https://registry.npmjs.org/
      - name: Yarn install
        run: yarn install --ignore-engines --frozen-lockfile
      - name: Publish npm package
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_AUTH_TOKEN}}

  # Posts a summary to #github-deploys and @-mentions the release author on
  # failure. always() so it still fires (and reports what broke) when the publish
  # job itself fails or is cancelled — this pipeline used to fail silently. Note:
  # if the whole run is cancelled (manual cancel / concurrency eviction) GitHub
  # cancels this job too, so that one case still goes unreported.
  notify:
    needs: [publish-npm]
    if: always()
    permissions:
      contents: read
      actions: read # to list this run's jobs for the per-stage summary
    uses: ./.github/workflows/notify-slack.yml
    with:
      pipeline: npm publish
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
