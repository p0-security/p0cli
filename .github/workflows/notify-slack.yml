on:
  workflow_call:
    inputs:
      pipeline:
        description: "Human name of the deploy pipeline, e.g. 'npm publish' or 'standalone builds'. Appears in the Slack headline."
        required: true
        type: string
    secrets:
      # Explicitly declared (not inherited) so this leaf only ever sees the one
      # secret it needs. The channel ID and user map are `vars.*` variables, which
      # are auto-available to reusable workflows and need no passing.
      SLACK_BOT_TOKEN:
        required: true

name: Deploy summary notification

# No id-token needed (not talking to GCP). actions:read lists this run's jobs for
# the per-stage summary.
permissions:
  contents: read
  actions: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      ACTOR: ${{ github.actor }}
      PIPELINE: ${{ inputs.pipeline }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # Release context. Empty on a workflow_dispatch run (build-standalone can be
      # dispatched manually), in which case the headline degrades to the actor.
      TAG: ${{ github.event.release.tag_name }}
      RELEASE_NAME: ${{ github.event.release.name }}
      RELEASE_URL: ${{ github.event.release.html_url }}
      RELEASE_AUTHOR: ${{ github.event.release.author.login }}
      SLACK_USER_MAP: ${{ vars.SLACK_USER_MAP }}
    steps:
      - id: build
        # shell: bash (not the implicit default) so the step runs with
        # `-eo pipefail`. The default `run` shell is `bash -e {0}` WITHOUT pipefail,
        # under which a failed `gh_api_retry | jq -s` would still exit 0 (jq on empty
        # input), leaving JOBS=[] and the job green — the exact silent failure this
        # notifier exists to prevent.
        shell: bash
        run: |
          # Retries transient GitHub API failures 3x, matching the convention in
          # app's notify-slack.yml.
          # stderr goes to a file, never into OUT: a gh deprecation/rate-limit
          # warning merged into stdout would make the downstream `jq -s` choke on
          # non-JSON and, under `bash -eo pipefail`, kill the whole step. The file
          # is surfaced only in the failure diagnostic.
          ERR_FILE="${RUNNER_TEMP:-/tmp}/gh_api_err"
          gh_api_retry() {
            for i in 1 2 3; do
              if OUT=$(gh api "$1" --paginate --jq "$2" 2>"$ERR_FILE"); then
                echo "$OUT"
                return 0
              fi
              [ "$i" -lt 3 ] && echo "gh api $1 failed (attempt $i/3): $(cat "$ERR_FILE"), retrying in 5s..." >&2 && sleep 5
            done
            echo "gh api $1 failed after 3 attempts: $(cat "$ERR_FILE")" >&2
            return 1
          }

          # Every completed job in this run EXCEPT this notify job: its own entry is
          # fetched WHILE it is still executing (status "in_progress", null
          # completed_at), which would skew both the status rollup and the wall-clock
          # math. Computed once and reused so the status and the per-stage detail can
          # never disagree about which jobs count.
          JOBS=$(gh_api_retry "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" '.jobs[]' | jq -s '.')
          COMPLETED=$(jq -c '
            map(select(.status == "completed"
                       and (.name | test("^notify( |/|$)") | not)))' <<< "$JOBS")

          # One line per completed job, in start order. A job cancelled while still
          # queued has null timestamps, so minutes is computed null-safely rather
          # than filtering the job out — dropping it would hide a cancelled deploy
          # from both the status and the detail entirely.
          STAGES=$(jq -c '
            sort_by(.started_at // "")
            | map({
                name: .name,
                conclusion: .conclusion,
                url: .html_url,
                minutes: (if (.started_at != null and .completed_at != null)
                          then ((((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) / 60) | round)
                          else null end),
              })
          ' <<< "$COMPLETED")

          # A job counts as failed unless it succeeded or was skipped. "cancelled"
          # IS counted as a failure: a run-level cancel also cancels this notify job,
          # so any cancelled job this notifier can observe is a per-job timeout or
          # eviction (GitHub reports a timeout-minutes overrun as "cancelled", not
          # "timed_out") — i.e. a build that produced no artifact, which must ping.
          IS_FAILED='(.conclusion != "success" and .conclusion != "skipped")'
          # "success" requires at least one job to have actually succeeded. An empty
          # job set, or a run where every job was skipped and none succeeded, is
          # reported as incomplete (:warning:) — never a green checkmark, which would
          # be the silent false-positive this notifier exists to prevent.
          OVERALL=$(jq -r "
            if any(.[]; $IS_FAILED) then \"failure\"
            elif any(.[]; .conclusion == \"success\") then \"success\"
            else \"incomplete\"
            end" <<< "$STAGES")
          FAILED_LABELS=$(jq -r "[.[] | select($IS_FAILED) | .name] | join(\", \")" <<< "$STAGES")
          # Wall-clock span of the run (the build jobs run in parallel), computed
          # from the jobs that actually started so it matches what the UI shows.
          TOTAL_MIN=$(jq -r '
            map(select(.started_at != null and .completed_at != null))
            | if length == 0 then 0 else
                (map(.started_at | fromdateiso8601) | min) as $s
                | (map(.completed_at | fromdateiso8601) | max) as $e
                | (($e - $s) / 60 | round)
              end' <<< "$COMPLETED")

          case "$OVERALL" in
            failure) EMOJI=":x:" ;;
            incomplete) EMOJI=":warning:" ;;
            *) EMOJI=":white_check_mark:" ;;
          esac

          case "$OVERALL" in
            failure) STATUS_WORD="FAILED" ;;
            incomplete) STATUS_WORD="did not complete" ;;
            *) STATUS_WORD="succeeded" ;;
          esac

          # Headline: release-centric, with a workflow_dispatch fallback.
          if [ -n "$TAG" ]; then
            TITLE="${RELEASE_NAME:-$TAG}"
            HEADLINE_TEXT="$EMOJI p0cli $PIPELINE for $TAG ($TITLE) $STATUS_WORD."
            HEADLINE_MRKDWN="$EMOJI p0cli *$PIPELINE* for *<$RELEASE_URL|$TAG>* $STATUS_WORD."
          else
            HEADLINE_TEXT="$EMOJI p0cli $PIPELINE (manual run by $ACTOR) $STATUS_WORD."
            HEADLINE_MRKDWN="$HEADLINE_TEXT"
          fi

          # Direct link to the first job that did not succeed (failed, cancelled, or
          # timed out), using the same predicate as OVERALL.
          FAILED_JOB_URL=$(jq -r "[.[] | select($IS_FAILED)] | .[0].url // \"\"" <<< "$STAGES")

          # @-mention the release author on failure, via the SLACK_USER_MAP repo
          # variable (GitHub login -> Slack member ID), same pattern as app. Falls
          # back to plain "@login" text (renders, does not ping) if the login isn't
          # in the map.
          #   NB: `${SLACK_USER_MAP:-{}}` looks equivalent but is a bash brace-
          #   counting trap — when the var IS set, bash still appends an extra "}"
          #   from the default word. Do the "default to {}" check as a separate
          #   statement instead.
          MAP_JSON="$SLACK_USER_MAP"
          [ -z "$MAP_JSON" ] && MAP_JSON='{}'
          # --arg (not --argjson): a malformed SLACK_USER_MAP variable would make
          # --argjson hard-error and, under Actions' implicit `bash -e -o pipefail`,
          # kill the whole step. fromjson? swallows a parse failure instead, so a
          # bad map loses only the mention, not the notification.
          # The release author if this was a release, else whoever triggered the
          # manual run — so a failed workflow_dispatch deploy still pings someone.
          MENTION_LOGIN="${RELEASE_AUTHOR:-$ACTOR}"
          MENTION=$(jq -rn --arg login "$MENTION_LOGIN" --arg map "$MAP_JSON" '
            (($map | fromjson? // {}) | .[$login] // "") as $id
            | if $login == "" then ""
              elif $id != "" then "<@" + $id + ">"
              else "@" + $login
              end')

          # Ping on failure AND incomplete: "incomplete" now means no job succeeded
          # (all skipped / nothing ran), which for a release still means no artifact
          # was produced and someone should look.
          MENTION_LINE=""
          if [ -n "$MENTION" ] && { [ "$OVERALL" = "failure" ] || [ "$OVERALL" = "incomplete" ]; }; then
            if [ -n "$FAILED_LABELS" ]; then
              MENTION_LINE=":bell: $MENTION — the p0cli $PIPELINE deploy did not succeed: $FAILED_LABELS"
            else
              MENTION_LINE=":bell: $MENTION — the p0cli $PIPELINE deploy did not complete (no jobs succeeded)"
            fi
            [ -n "$FAILED_JOB_URL" ] && MENTION_LINE="$MENTION_LINE (<$FAILED_JOB_URL|view job>)"
          fi

          HEADLINE_BLOCKS=$(jq -nc --arg h "$HEADLINE_MRKDWN" --arg m "$MENTION_LINE" '
            [{type:"section", text:{type:"mrkdwn", text:$h}}]
            + (if $m != "" then [{type:"section", text:{type:"mrkdwn", text:$m}}] else [] end)')

          # Default emoji is ❌ so it covers every non-success/skip/cancel
          # conclusion (failure, timed_out, action_required, …), matching OVERALL.
          # Minutes are omitted for a job that never started (null timestamps).
          DETAIL_LINES=$(jq -r '
            .[] |
            (if .conclusion == "success" then "✅"
             elif .conclusion == "skipped" then "⏭️"
             elif .conclusion == "cancelled" then "🚫"
             else "❌" end) as $e |
            (if .minutes == null then ""
             elif .minutes == 0 then " (<1m)"
             else " (\(.minutes)m)" end) as $m |
            "\($e) *\(.name)* — \(.conclusion // "unknown")\($m)"
          ' <<< "$STAGES")
          # Slack's chat.postMessage rejects a section with empty mrkdwn text; with
          # errors: true that would fail this step outright.
          [ -z "$DETAIL_LINES" ] && DETAIL_LINES="(no per-stage data)"

          # "<1m" rather than "0m" for a sub-minute run (round() floors 0–29s to 0).
          TOTAL_DISPLAY="${TOTAL_MIN}m"
          [ "$TOTAL_MIN" = "0" ] && TOTAL_DISPLAY="<1m"
          FOOTER="by $ACTOR · <$RUN_URL|view run> · total $TOTAL_DISPLAY"

          DETAIL_BLOCKS=$(jq -nc --arg lines "$DETAIL_LINES" --arg footer "$FOOTER" '
            [{type:"section", text:{type:"mrkdwn", text:$lines}},
             {type:"context", elements:[{type:"mrkdwn", text:$footer}]}]')

          # Heredoc form, not "key=value" lines: a stray newline in a "key=value"
          # write silently corrupts every output after it.
          {
            echo "headline_text<<HEADLINE_TEXT_EOF"
            echo "$HEADLINE_TEXT"
            echo "HEADLINE_TEXT_EOF"
            echo "headline_blocks<<HEADLINE_BLOCKS_EOF"
            echo "$HEADLINE_BLOCKS"
            echo "HEADLINE_BLOCKS_EOF"
            echo "detail_blocks<<DETAIL_BLOCKS_EOF"
            echo "$DETAIL_BLOCKS"
            echo "DETAIL_BLOCKS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post headline to #github-deploys
        id: post_headline
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          # errors defaults to false, which would leave this step (and the job)
          # green even on a Slack-side rejection (bad channel, missing scope, rate
          # limit) with no message ever posted — exactly the failure mode to avoid
          # in a deploy notifier.
          errors: true
          # v3 API: channel lives INSIDE the payload; there is no channel-id input.
          payload: |
            channel: "${{ vars.SLACK_GITHUB_DEPLOYS_CHANNEL_ID }}"
            text: ${{ toJson(steps.build.outputs.headline_text) }}
            blocks: ${{ steps.build.outputs.headline_blocks }}

      - name: Post per-stage detail as a threaded reply
        # Only thread off a real parent message. If the headline step failed or was
        # skipped, ts is empty and posting anyway would land as a stray top-level
        # message instead of a reply.
        if: steps.post_headline.outputs.ts != ''
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: "${{ vars.SLACK_GITHUB_DEPLOYS_CHANNEL_ID }}"
            thread_ts: "${{ steps.post_headline.outputs.ts }}"
            text: "Per-stage deploy summary"
            blocks: ${{ steps.build.outputs.detail_blocks }}

      - name: Fallback alert if the notifier itself failed
        # Backstop for the summary being lost entirely — the build step dying (API
        # down after retries, a jq error) or the headline post failing. Uses only
        # static context values (no API call, no jq, no step outputs), so it cannot
        # fail the same way and the channel always hears that a deploy finished with
        # an unknown result. A deploy that actually succeeded never reaches here.
        if: failure()
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: "${{ vars.SLACK_GITHUB_DEPLOYS_CHANNEL_ID }}"
            text: ":rotating_light: p0cli ${{ inputs.pipeline }}${{ github.event.release.tag_name && format(' for {0}', github.event.release.tag_name) || '' }} — deploy status UNKNOWN: the notifier itself failed. Check the run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
